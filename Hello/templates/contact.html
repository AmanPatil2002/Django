{% extends "base.html" %}

{% block title%}Contact{% endblock title%}

{% block body%}

<div class="container-fluid px-0 mb-3">
  <style>
    /* make the contact image fill the frame */
    #image-contact {
      width: 100%;
      height: 92vh;        /* full viewport height */
      object-fit: cover;    /* crop to fill without distortion */
      display: block;
    }
    /* on very small screens reduce height a bit so header/controls remain visible */
    @media (max-width: 576px) {
      #image-contact { height: 60vh; }
    }
  </style>

  <img src="/static/img/contact-img.jpg" id="image-contact" class="d-block" alt="Contact">
</div>
<div class="container mb-5 w-50">
  <h1 class='text-center'>Contact Us</h1>
  <form method="post" action="/contact">
    {% csrf_token %}
  <div class="form-group">
    <label for="name">Name</label>
    <input type="name" class="form-control" id="name" name="name" placeholder="Enter your name">
  </div><br>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your E-mail">
  </div><br>
  <div class="mb-3">
    <label for="desc">Tell me about why you want to contact us.</label>
    <textarea class="form-control" id="desc" rows="3" name="desc"></textarea>
   </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>
{% endblock body%}
